<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스타 끄투 (Star Kkutu)</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; user-select: none; }
    h1 { color: #4CAF50; margin-bottom: 5px; }
    .top-bar { display: flex; justify-content: space-between; width: 100%; max-width: 1000px; align-items: center; margin-bottom: 10px; }
    .container { display: flex; width: 100%; max-width: 1000px; gap: 20px; }
    .panel { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; }
    
    /* 왼쪽: 단어 뜻 출력 영역 */
    .left-panel { flex: 1; display: flex; flex-direction: column; }
    .def-box { background: #252525; border-left: 4px solid #4CAF50; padding: 10px; margin-top: 10px; min-height: 150px; border-radius: 4px; font-size: 14px; line-height: 1.5; }

    /* 가운데: 메인 게임 영역 */
    .main-panel { flex: 2; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .word-display { font-size: 42px; font-weight: bold; color: #ffeb3b; margin: 20px 0; }
    .timer { font-size: 20px; color: #ff5722; margin-bottom: 15px; }
    input[type="text"] { width: 80%; padding: 12px; font-size: 18px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #fff; margin-bottom: 10px; }
    button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #45a049; }

    /* 오른쪽: 플레이어 목록 */
    .right-panel { flex: 1; }
    .player-list { list-style: none; padding: 0; }
    .player-item { padding: 8px; margin: 5px 0; background: #2a2a2a; border-radius: 4px; display: flex; justify-content: space-between; }
    .gm-bg { border-left: 4px solid #ff9800; }
    .bot-bg { border-left: 4px solid #00bcd4; }

    .chat-box { background: #121212; border: 1px solid #333; height: 150px; overflow-y: scroll; padding: 10px; margin-top: 15px; text-align: left; font-size: 13px; border-radius: 4px; }
    
    /* ⚙️ 원작 끄투 사운드 설정 패널 */
    .sound-settings { background: #252525; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 13px; text-align: left; border: 1px solid #444; }
    .sound-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      <h1>🌟 스타 끄투 (Star Kkutu)</h1>
      <div id="userInfo" style="font-size: 13px; color: #aaa;">로그인 확인 중...</div>
    </div>
  </div>

  <div class="container">
    <!-- 왼쪽 패널: 뜻 출력 -->
    <div class="panel left-panel">
      <h3>📖 최근 단어 뜻</h3>
      <div id="currentWordTitle" style="font-weight: bold; color: #4CAF50; margin-bottom: 5px;">-</div>
      <div class="def-box" id="definitionBox">단어가 입력되면 여기에 뜻이 표시됩니다.</div>
    </div>

    <!-- 메인 게임 패널 -->
    <div class="panel main-panel">
      <div class="timer" id="timerDisplay">남은 시간: 15초</div>
      <div class="word-display" id="wordDisplay">스타끄투</div>
      <div id="turnIndicator" style="font-size: 16px; margin-bottom: 15px; color: #ffeb3b;">대기 중...</div>

      <div style="width: 100%;">
        <input type="text" id="wordInput" placeholder="단어를 입력하세요..." autocomplete="off">
        <br>
        <button id="submitBtn">입력하기</button>
      </div>

      <div class="chat-box" id="chatBox"></div>
    </div>

    <!-- 오른쪽 패널: 플레이어 및 사운드 환경설정 -->
    <div class="panel right-panel">
      <h3>👥 플레이어 목록</h3>
      <ul class="player-list" id="playerList"></ul>

      <!-- ⚙️ 끄투 오리지널 스타일 사운드 설정 -->
      <div class="sound-settings">
        <strong>⚙️ 사운드 설정</strong>
        <div class="sound-row" style="margin-top: 8px;">
          <span>🎵 배경음악 (BGM)</span>
          <input type="checkbox" id="bgmMuteToggle" checked>
        </div>
        <div class="sound-row">
          <span>🔔 효과음 (SFX)</span>
          <input type="checkbox" id="sfxMuteToggle" checked>
        </div>
      </div>
    </div>
  </div>

  <!-- 💡 원작 끄투 사운드 엔진 & 자동 재생 바인딩 -->
  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let isAudioActivated = false;

    // 브라우저 첫 상호작용(클릭, 키 입력) 시 사운드 엔진 자동 활성화 및 BGM 자동 시작
    function activateAudio() {
      if (!isAudioActivated) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        isAudioActivated = true;
        startBgmLoop();
      }
    }
    window.addEventListener('click', activateAudio, { once: true });
    window.addEventListener('keydown', activateAudio, { once: true });

    // 사운드 설정 상태
    let bgmEnabled = true;
    let sfxEnabled = true;

    document.getElementById('bgmMuteToggle').addEventListener('change', (e) => {
      bgmEnabled = e.target.checked;
    });
    document.getElementById('sfxMuteToggle').addEventListener('change', (e) => {
      sfxEnabled = e.target.checked;
    });

    // 1. 정답 효과음 (청량한 2음)
    function playCorrectSound() {
      if (!sfxEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, now); // D5
      osc.frequency.setValueAtTime(880, now + 0.08); // A5
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    }

    // 2. 오답 / 경고 효과음 (버저)
    function playErrorSound() {
      if (!sfxEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.setValueAtTime(110, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    // 3. 타이머 틱 소리
    function playTickSound() {
      if (!sfxEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    }

    // 4. 2014 끄투 8비트 스타일 BGM 무한 루프
    const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
    let noteIdx = 0;

    function startBgmLoop() {
      setInterval(() => {
        if (!bgmEnabled) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(notes[noteIdx], now);
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
        noteIdx = (noteIdx + 1) % notes.length;
      }, 300);
    }
  </script>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myProfile = null;

    fetch('/api/user')
      .then(res => res.json())
      .then(data => {
        if (data.loggedIn) {
          myProfile = data.user;
          document.getElementById('userInfo').innerText = `👤 접속 계정: ${data.user.name} (@${data.user.username})`;
        } else {
          window.location.href = '/auth/github';
        }
      });

    const wordInput = document.getElementById('wordInput');
    const submitBtn = document.getElementById('submitBtn');
    const chatBox = document.getElementById('chatBox');

    function appendSystemMsg(msg, isError = false) {
      const div = document.createElement('div');
      div.innerText = msg;
      if (isError) {
        div.style.color = '#ff5252';
        playErrorSound();
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    submitBtn.addEventListener('click', sendWord);
    wordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendWord();
    });

    function sendWord() {
      const val = wordInput.value;
      if (!val) return;
      socket.emit('submitWord', val);
      wordInput.value = '';
    }

    socket.on('systemMessage', (msg) => {
      const isErr = msg.includes('❌') || msg.includes('초과');
      appendSystemMsg(msg, isErr);
    });

    socket.on('updatePlayers', (players) => {
      const list = document.getElementById('playerList');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.className = `player-item ${p.isGM ? 'gm-bg' : (p.isBot ? 'bot-bg' : '')}`;
        li.innerHTML = `<span>${p.badge} ${p.name}</span>`;
        list.appendChild(li);
      });
    });

    socket.on('gameStart', (data) => {
      document.getElementById('wordDisplay').innerText = data.currentWord;
    });

    socket.on('turnChange', (data) => {
      document.getElementById('wordDisplay').innerText = data.currentWord;
      const isMe = myProfile && data.currentPlayer.username === myProfile.username;
      const indicator = document.getElementById('turnIndicator');
      if (isMe) {
        indicator.innerHTML = `<span style="color: #4CAF50; font-weight: bold;">⭐ 내 차례입니다! 단어를 입력하세요.</span>`;
      } else {
        indicator.innerText = `현재 차례: ${data.currentPlayer.name}님`;
      }
    });

    socket.on('timerTick', (time) => {
      document.getElementById('timerDisplay').innerText = `남은 시간: ${time}초`;
      if (time <= 3 && time > 0) {
        playTickSound();
      }
    });

    socket.on('wordAccepted', (data) => {
      playCorrectSound();
      document.getElementById('currentWordTitle').innerText = `단어: ${data.word} (${data.player.name})`;
      document.getElementById('definitionBox').innerText = data.definition;
      appendSystemMsg(`✅ [${data.player.name}]님이 "${data.word}" 단어를 입력했습니다.`);
    });
  </script>
</body>
</html>
