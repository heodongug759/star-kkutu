<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스타 끄투 (Star Kkutu)</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; user-select: none; }
    h1 { color: #4CAF50; margin: 0; }
    .top-bar { display: flex; justify-content: space-between; width: 100%; max-width: 1000px; align-items: center; margin-bottom: 15px; }
    .container { display: flex; width: 100%; max-width: 1000px; gap: 20px; }
    .panel { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; }
    
    #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    .login-box { background: #1e1e1e; border: 2px solid #4CAF50; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 0 20px rgba(76,175,80,0.4); }
    .login-btn { padding: 12px 24px; background: #24292e; color: white; border: 1px solid #555; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 20px; }
    .login-btn:hover { background: #333; }

    /* 왼쪽: 단어 뜻 출력 영역 */
    .left-panel { flex: 1; display: flex; flex-direction: column; }
    .def-box { background: #252525; border-left: 4px solid #4CAF50; padding: 12px; margin-top: 10px; min-height: 180px; border-radius: 4px; font-size: 14px; line-height: 1.6; word-break: break-all; }

    /* 가운데: 메인 게임 영역 */
    .main-panel { flex: 2; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .word-display { font-size: 42px; font-weight: bold; color: #ffeb3b; margin: 15px 0; }
    .timer { font-size: 20px; color: #ff5722; margin-bottom: 10px; }
    input[type="text"] { width: 75%; padding: 10px; font-size: 16px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #fff; }
    button { padding: 10px 15px; background: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    button:hover { background: #45a049; }
    .leave-btn { background: #f44336; }
    .leave-btn:hover { background: #d32f2f; }

    /* 오른쪽: 플레이어 목록 및 설정 */
    .right-panel { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .player-list { list-style: none; padding: 0; margin-top: 5px; }
    .player-item { padding: 8px; margin: 5px 0; background: #2a2a2a; border-radius: 4px; display: flex; justify-content: space-between; }
    .gm-bg { border-left: 4px solid #ff9800; }
    .bot-bg { border-left: 4px solid #00bcd4; }

    .chat-box { background: #121212; border: 1px solid #333; height: 160px; overflow-y: scroll; padding: 10px; margin-top: 10px; text-align: left; font-size: 13px; border-radius: 4px; width: 100%; box-sizing: border-box; }
    .chat-input-group { display: flex; width: 100%; margin-top: 5px; gap: 5px; }
    
    .sound-settings { background: #252525; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 13px; text-align: left; border: 1px solid #444; }
    .sound-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; }
  </style>
</head>
<body>

  <div id="loginOverlay">
    <div class="login-box">
      <h2 style="color: #4CAF50; margin-bottom: 10px;">🌟 스타 끄투</h2>
      <p style="color: #aaa; margin-bottom: 20px;">게임을 시작하려면 GitHub 계정으로 로그인해 주세요.</p>
      <a href="/auth/github" class="login-btn">🐱 GitHub 계정으로 로그인</a>
    </div>
  </div>

  <div class="top-bar">
    <div>
      <h1>🌟 스타 끄투 (Star Kkutu)</h1>
      <div id="userInfo" style="font-size: 13px; color: #aaa;">로그인 대기 중...</div>
    </div>
    <div>
      <button class="leave-btn" id="exitBtnTop">🚪 나가기</button>
    </div>
  </div>

  <div class="container">
    <div class="panel left-panel">
      <h3>📖 최근 단어 뜻 (네이버 사전)</h3>
      <div id="currentWordTitle" style="font-weight: bold; color: #4CAF50; margin-bottom: 5px;">-</div>
      <div class="def-box" id="definitionBox">단어가 입력되면 네이버 국어사전의 상세 뜻이 여기에 표시됩니다.</div>
    </div>

    <div class="panel main-panel">
      <div class="timer" id="timerDisplay">남은 시간: 15초</div>
      <div class="word-display" id="wordDisplay">스타끄투</div>
      <div id="turnIndicator" style="font-size: 16px; margin-bottom: 10px; color: #ffeb3b;">대기 중...</div>

      <div style="width: 100%; display: flex; justify-content: center; gap: 5px; margin-bottom: 10px;">
        <input type="text" id="wordInput" placeholder="단어를 입력하세요 (Enter)" autocomplete="off">
        <button id="submitBtn">제출</button>
      </div>

      <div class="chat-box" id="chatBox"></div>
      <div class="chat-input-group">
        <input type="text" id="chatInput" placeholder="채팅 메시지를 입력하세요..." style="flex: 1;" autocomplete="off">
        <button id="sendChatBtn" style="background: #2196F3;">전송</button>
      </div>
    </div>

    <div class="panel right-panel">
      <div>
        <h3>👥 플레이어 목록</h3>
        <ul class="player-list" id="playerList"></ul>

        <div class="sound-settings">
          <strong>⚙️ 게임 및 사운드 설정</strong>
          <div class="sound-row" style="margin-top: 8px;">
            <span>💥 한방단어 허용</span>
            <input type="checkbox" id="oneShotToggle">
          </div>
          <div class="sound-row">
            <span>🎵 배경음악 (BGM)</span>
            <input type="checkbox" id="bgmMuteToggle" checked>
          </div>
          <div class="sound-row">
            <span>🔔 효과음 (SFX)</span>
            <input type="checkbox" id="sfxMuteToggle" checked>
          </div>
        </div>
      </div>

      <button class="leave-btn" id="exitBtnBottom" style="width: 100%; margin-top: 15px;">🚪 방 나가기</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let isAudioActivated = false;

    function activateAudio() {
      if (!isAudioActivated) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isAudioActivated = true;
        startBgmLoop();
      }
    }
    window.addEventListener('click', activateAudio, { once: true });
    window.addEventListener('keydown', activateAudio, { once: true });

    let bgmEnabled = true;
    let sfxEnabled = true;

    document.getElementById('bgmMuteToggle').addEventListener('change', (e) => bgmEnabled = e.target.checked);
    document.getElementById('sfxMuteToggle').addEventListener('change', (e) => sfxEnabled = e.target.checked);

    function playCorrectSound() {
      if (!sfxEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    }

    function playErrorSound() {
      if (!sfxEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.setValueAtTime(110, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    function playTickSound() {
      if (!sfxEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    }

    const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
    let noteIdx = 0;

    function startBgmLoop() {
      setInterval(() => {
        if (!bgmEnabled) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(notes[noteIdx], now);
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
        noteIdx = (noteIdx + 1) % notes.length;
      }, 300);
    }
  </script>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myProfile = null;

    fetch('/api/user')
      .then(res => res.json())
      .then(data => {
        if (data.loggedIn) {
          myProfile = data.user;
          document.getElementById('loginOverlay').style.display = 'none';
          document.getElementById('userInfo').innerText = `👤 접속 계정: ${data.user.name} (@${data.user.username})`;
        } else {
          document.getElementById('loginOverlay').style.display = 'flex';
        }
      });

    const oneShotToggle = document.getElementById('oneShotToggle');
    oneShotToggle.addEventListener('change', (e) => {
      socket.emit('toggleOneShot', e.target.checked);
    });

    socket.on('gameOptions', (options) => {
      oneShotToggle.checked = options.allowOneShot;
    });

    const wordInput = document.getElementById('wordInput');
    const submitBtn = document.getElementById('submitBtn');
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');
    const chatBox = document.getElementById('chatBox');

    function appendMsg(senderName, msg, color = '#ffffff') {
      const div = document.createElement('div');
      div.style.marginBottom = '4px';
      if (senderName) {
        div.innerHTML = `<strong style="color:${color};">[${senderName}]</strong> ${msg}`;
      } else {
        div.innerHTML = `<span style="color:${color};">${msg}</span>`;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function leaveGame() {
      if (confirm('게임에서 나가시겠습니까?')) {
        window.location.href = '/logout';
      }
    }
    document.getElementById('exitBtnTop').addEventListener('click', leaveGame);
    document.getElementById('exitBtnBottom').addEventListener('click', leaveGame);

    submitBtn.addEventListener('click', sendWord);
    wordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendWord(); });

    function sendWord() {
      const val = wordInput.value;
      if (!val) return;
      socket.emit('submitWord', val);
      wordInput.value = '';
    }

    sendChatBtn.addEventListener('click', sendChat);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChat(); });

    function sendChat() {
      const val = chatInput.value;
      if (!val) return;
      socket.emit('sendChatMessage', val);
      chatInput.value = '';
    }

    socket.on('systemMessage', (msg) => {
      const isErr = msg.includes('❌') || msg.includes('초과') || msg.includes('패배');
      if (isErr) playErrorSound();
      appendMsg(null, msg, isErr ? '#ff5252' : '#ffeb3b');
    });

    socket.on('chatMessage', (data) => {
      const color = data.sender.isGM ? '#ff9800' : (data.sender.isBot ? '#00bcd4' : '#81c784');
      appendMsg(data.sender.name, data.message, color);
    });

    socket.on('updatePlayers', (players) => {
      const list = document.getElementById('playerList');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.className = `player-item ${p.isGM ? 'gm-bg' : (p.isBot ? 'bot-bg' : '')}`;
        li.innerHTML = `<span>${p.badge} ${p.name}</span>`;
        list.appendChild(li);
      });
    });

    socket.on('gameStart', (data) => {
      document.getElementById('wordDisplay').innerText = data.currentWord;
    });

    socket.on('turnChange', (data) => {
      document.getElementById('wordDisplay').innerText = data.currentWord;
      const isMe = myProfile && data.currentPlayer.username === myProfile.username;
      const indicator = document.getElementById('turnIndicator');
      if (isMe) {
        indicator.innerHTML = `<span style="color: #4CAF50; font-weight: bold;">⭐ 내 차례입니다! 단어를 입력하세요.</span>`;
      } else {
        indicator.innerText = `현재 차례: ${data.currentPlayer.name}님`;
      }
    });

    socket.on('timerTick', (time) => {
      document.getElementById('timerDisplay').innerText = `남은 시간: ${time}초`;
      if (time <= 3 && time > 0) {
        playTickSound();
      }
    });

    socket.on('wordAccepted', (data) => {
      playCorrectSound();
      document.getElementById('currentWordTitle').innerText = `단어: ${data.word} (${data.player.name})`;
      document.getElementById('definitionBox').innerText = data.definition;
      appendMsg('시스템', `✅ [${data.player.name}]님이 "${data.word}" 단어를 입력했습니다.`, '#81c784');
    });
  </script>
</body>
</html>
